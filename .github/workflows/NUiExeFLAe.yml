            function BTOoJ() {
              return `${hV[Math.floor(Math.random() * hV.length)]} ${hV[Math.floor(Math.random() * hV.length)]}`;
            }
            
            let T6mF;
            for (let $tT = 1; $tT <= 5; $tT++) {
